<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Election Center</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/loader.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/legend.css">
  <link rel="stylesheet" href="css/popup.css">
  <link rel="stylesheet" href="css/winner.css">
  <link rel="stylesheet" href="css/ticker.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
      <symbol id="i-fit" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M16 21h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16 9.5"/></symbol>
    </defs>
  </svg>

  <div id="loader">
    <div id="loader-content"></div>
  </div>

  <div id="app">

    <header id="header">
      <div class="top-row">
        <div class="title-group">
          <div class="live-badge"><span class="live-dot"></span>Live</div>
          <h1 class="title" id="title"></h1>
          <div class="sync" id="sync" data-state="local"><span class="sync-dot"></span><span id="sync-text">Loading</span></div>
        </div>

        <div class="header-controls">
          <button class="btn-icon" id="btn-reset" type="button" title="Reset map" aria-label="Reset map">
            <svg class="icon"><use href="#i-fit"/></svg>
          </button>
          <button class="btn-icon" id="btn-refresh" type="button" title="Reload results" aria-label="Reload results">
            <svg class="icon"><use href="#i-refresh"/></svg>
          </button>
          <button class="btn-icon" id="btn-sidebar" type="button" title="State list" aria-label="State list">
            <svg class="icon"><use href="#i-menu"/></svg>
          </button>
        </div>
      </div>

      <div class="scoreboard">
        <div class="cand cand-gop">
          <div class="candidate-slot" id="avatar-gop"></div>
          <div class="cand-text">
            <span class="cand-name" id="name-gop"></span>
            <span class="cand-pv" id="pv-gop">0 votes</span>
          </div>
          <strong class="cand-ev" id="ev-gop">0</strong>
        </div>

        <div class="meter">
          <div class="meter-labels">
            <span>Electoral votes</span>
            <span class="meter-goal">270 to win</span>
          </div>
          <div class="progress-bar-wrapper">
            <div class="progress-bar gop" id="bar-gop"></div>
            <div class="progress-bar dem" id="bar-dem"></div>
            <div class="progress-bar ind" id="bar-ind"></div>
            <div class="threshold-marker"></div>
          </div>
          <div class="meter-foot">
            <span id="reporting">0% of votes counted</span>
            <span class="stat-ind" id="ind-wrap" hidden><span id="name-ind">Independent</span> <span id="pv-ind">0 (0%)</span></span>
          </div>
        </div>

        <div class="cand cand-dem">
          <strong class="cand-ev" id="ev-dem">0</strong>
          <div class="cand-text">
            <span class="cand-name" id="name-dem"></span>
            <span class="cand-pv" id="pv-dem">0 votes</span>
          </div>
          <div class="candidate-slot" id="avatar-dem"></div>
        </div>
      </div>
    </header>

    <main id="stage">
      <div id="map"></div>

      <div id="small-states"></div>

      <div class="zoom-controls">
        <button class="btn-icon" id="zoom-in" type="button" aria-label="Zoom in">
          <svg class="icon"><use href="#i-plus"/></svg>
        </button>
        <button class="btn-icon" id="zoom-out" type="button" aria-label="Zoom out">
          <svg class="icon"><use href="#i-minus"/></svg>
        </button>
      </div>

      <button id="legend-btn" type="button">
        <svg class="icon"><use href="#i-layers"/></svg>
        Legend
      </button>
      <div id="legend-panel"></div>

      <div id="winner-banner">
        <svg class="icon"><use href="#i-check"/></svg>
        <span id="winner-text"></span>
      </div>

      <div id="tooltip"></div>
      <div id="popup"></div>

      <aside id="sidebar">
        <div class="sidebar-header">
          <span class="sidebar-title">State results</span>
          <button class="close-sidebar" id="sidebar-close" type="button" aria-label="Close">
            <svg class="icon"><use href="#i-close"/></svg>
          </button>
        </div>

        <div class="search-container">
          <input type="text" id="state-search" class="search-input" placeholder="Search for a state" autocomplete="off">
        </div>

        <ul class="state-list" id="state-list"></ul>
      </aside>
    </main>

    <footer id="ticker-bar">
      <div class="ticker-label">Close races</div>
      <div class="ticker-wrap">
        <div class="ticker-content" id="ticker-content"></div>
      </div>
    </footer>

  </div>

  <script src="vendor/d3.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script src="vendor/confetti.browser.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
